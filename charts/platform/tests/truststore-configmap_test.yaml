suite: test trust store ConfigMap
templates:
  - truststore-configmap.yaml
chart:
  version: 1.2.3
  appVersion: "v9.9.9"
tests:
  - it: should not render when the trust store is disabled
    asserts:
      - hasDocuments:
          count: 0

  - it: should not render when enabled without any CA source
    set:
      global.trustStore.enabled: true
    asserts:
      - hasDocuments:
          count: 0

  - it: should not render when the certificate is supplied but the trust store is disabled
    set:
      global.trustStore.certificate: |
        -----BEGIN CERTIFICATE-----
        TEST
        -----END CERTIFICATE-----
    asserts:
      - hasDocuments:
          count: 0

  - it: should render the CA bundle when supplied inline
    set:
      global.trustStore.enabled: true
      global.trustStore.certificate: |
        -----BEGIN CERTIFICATE-----
        TEST
        -----END CERTIFICATE-----
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.name
          value: release-name-platform-trust-store-ca
      - equal:
          path: data
          value:
            ca.crt: |
              -----BEGIN CERTIFICATE-----
              TEST
              -----END CERTIFICATE-----

  - it: should honour a custom key
    set:
      global.trustStore.enabled: true
      global.trustStore.key: corp-root.pem
      global.trustStore.certificate: |
        -----BEGIN CERTIFICATE-----
        TEST
        -----END CERTIFICATE-----
    asserts:
      - equal:
          path: data
          value:
            corp-root.pem: |
              -----BEGIN CERTIFICATE-----
              TEST
              -----END CERTIFICATE-----

  # The bundle is managed outside the release in these two cases, so creating a
  # ConfigMap would silently shadow the user's own object.
  - it: should not render when an existing ConfigMap is supplied
    set:
      global.trustStore.enabled: true
      global.trustStore.existingConfigMap: corp-ca
      global.trustStore.certificate: |
        -----BEGIN CERTIFICATE-----
        TEST
        -----END CERTIFICATE-----
    asserts:
      - hasDocuments:
          count: 0

  - it: should not render when an existing Secret is supplied
    set:
      global.trustStore.enabled: true
      global.trustStore.existingSecret: corp-ca
      global.trustStore.certificate: |
        -----BEGIN CERTIFICATE-----
        TEST
        -----END CERTIFICATE-----
    asserts:
      - hasDocuments:
          count: 0
