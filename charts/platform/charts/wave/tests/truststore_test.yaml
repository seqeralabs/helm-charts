suite: test Wave private CA trust store wiring
templates:
  - deployment.yaml
  - secret.yaml
  - configmap.yaml
chart:
  version: 1.2.3
  appVersion: "v9.9.9"
set:
  database:
    host: wave-db
    name: wave
    username: wave
    password: wave
  redis:
    host: wave-redis
    password: redis
tests:
  - it: should add nothing when disabled
    template: deployment.yaml
    asserts:
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: seqera-trust-ca

  # Wave is a Micronaut JVM service, so it takes the generated store rather than
  # the PEM environment variables used by the non-JVM subcharts.
  - it: should build and mount a Java trust store when enabled
    template: deployment.yaml
    set:
      global.trustStore.enabled: true
      global.trustStore.existingConfigMap: corp-ca
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: seqera-trust-ca
            configMap:
              name: corp-ca
      - contains:
          path: spec.template.spec.volumes
          content:
            name: seqera-trust-store
            emptyDir: {}
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: JAVA_TOOL_OPTIONS
            value: "-Djavax.net.ssl.trustStore=/opt/seqera/truststore/cacerts -Djavax.net.ssl.trustStorePassword=changeit"
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: seqera-trust-store
            mountPath: /opt/seqera/truststore
            readOnly: true

  - it: should include the trust store init container
    template: deployment.yaml
    set:
      global.trustStore.enabled: true
      global.trustStore.existingConfigMap: corp-ca
    asserts:
      - contains:
          path: spec.template.spec.initContainers
          content:
            name: build-trust-store
          any: true

  # This covers Wave's own outbound calls only. BuildKit runs in pods Wave
  # launches itself, outside this chart, and needs an image with the CA baked in.
  - it: should not set the PEM environment variables used by non-JVM services
    template: deployment.yaml
    set:
      global.trustStore.enabled: true
      global.trustStore.existingConfigMap: corp-ca
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: SSL_CERT_FILE
            value: "/opt/seqera/trust/ca.crt"
